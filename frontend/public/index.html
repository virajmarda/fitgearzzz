    <!--
      ============================================================
      ANALYTICS — Issue #7

      IMPORTANT: Hardcoded pixel IDs have been REMOVED from this file.
      All analytics are now managed via environment variables and
      the src/lib/analytics.js module.

      ACTIVATION STEPS (after Shopify plan purchase):

      1. GA4:
         - Create property at analytics.google.com
         - Get Measurement ID (format: G-XXXXXXXXXX)
         - Add to Vercel env: REACT_APP_GA4_MEASUREMENT_ID=G-XXXXXXXXXX
         - Paste the gtag.js script below (replacing PLACEHOLDER):

      <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
      </script>

      2. Meta Pixel:
         - Get Pixel ID from Meta Events Manager
         - Add to Vercel env: REACT_APP_META_PIXEL_ID=your_pixel_id
         - Paste the fbevents.js snippet below (replacing PLACEHOLDER):

      <script>
        !function(f,b,e,v,n,t,s){...}
        fbq('init', 'YOUR_PIXEL_ID');
        fbq('track', 'PageView');
      </script>

      3. PostHog (optional):
         - Set REACT_APP_POSTHOG_KEY in Vercel env vars
         - The tracking will be handled in React components

      NOTE: Previously committed pixel IDs (867237629399727 and 1635842960929487)
      and PostHog key have been removed. Rotate them per SECURITY_ROTATION.md.
      ============================================================
    -->

    <!--
